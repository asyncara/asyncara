name: Optional Hyper backend verification
on:
  workflow_dispatch:
  push:
    paths: ['ext/**', 'src/**', 'tests/http/**', 'tests/server/**', 'scripts/build-hyper-local.sh', '.github/workflows/hyper.yml']
  pull_request:
    paths: ['ext/**', 'src/**', 'tests/http/**', 'tests/server/**', 'scripts/build-hyper-local.sh', '.github/workflows/hyper.yml']
permissions:
  contents: read
jobs:
  hyper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - run: sudo add-apt-repository -y ppa:ondrej/php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Prepare disposable runner dependencies
        env:
          PHP_DEV_PACKAGE: php${{ matrix.php }}-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb3 libcurl4t64 libsqlite3-0 libpq5 cmake
          ./scripts/bootstrap-local.sh
          echo "PHP_INCLUDE_DIR=$(find "$PWD/.local/sysroot/usr/include/php" -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
      - name: Isolated Rust and native fail-stop regressions
        run: python3 tests/http/hyper_ffi.py --output build/hyper-ffi
      - name: Build ordinary module without test fault controls
        run: |
          CARGO_TARGET_DIR="$PWD/build/hyper-production" ASYNCARA_OUTPUT=build/hyper.so bash scripts/build-hyper-local.sh
          nm -D build/hyper.so > build/hyper-symbols.txt
          if grep -q ar_hyper_test_fault build/hyper-symbols.txt; then exit 1; fi
          ./scripts/prepare-test-certs.sh
      - name: HTTP gate on epoll and poll
        run: python3 tests/http/run.py --php php --extension build/hyper.so --output build/hyper-http --hyper
      - name: Server protocol, TLS and bounded streaming on epoll and poll
        run: |
          for backend in epoll poll; do
            ASYNCARA_BACKEND="$backend" php -n -d extension="$PWD/build/hyper.so" tests/server/api.php
            for test in run tls stream; do
              python3 tests/server/"$test".py --php php --module build/hyper.so --backend "$backend" --out build/hyper-server/"$backend-$test"
            done
            python3 tests/server/stream.py --php php --module build/hyper.so --backend "$backend" --tls --out build/hyper-server/"$backend-tls-stream"
          done
      - name: Controlled resolver ownership (separate test-only module)
        run: |
          CARGO_TARGET_DIR="$PWD/build/hyper-production" ASYNCARA_OUTPUT=build/hyper-dns-gated.so EXTRA_LDFLAGS='tests/http/dns_gate.c -Wl,--wrap=getaddrinfo' bash scripts/build-hyper-local.sh
          ASYNCARA_HTTP_BACKEND=hyper-prototype ASYNCARA_BACKEND=epoll php -n -d extension="$PWD/build/hyper-dns-gated.so" tests/http/hyper_dns_lifecycle.php
          ASYNCARA_HTTP_BACKEND=hyper-prototype ASYNCARA_BACKEND=poll php -n -d extension="$PWD/build/hyper-dns-gated.so" tests/http/hyper_dns_lifecycle.php
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyper-php-${{ matrix.php }}
          path: |
            build/hyper-ffi/*.json
            build/hyper-ffi/*.log
            build/hyper-http/
            build/hyper-server/**/*.json
            build/hyper-server/**/*.log
