name: Runtime verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Extract development dependencies locally
        env:
          PHP_DEV_PACKAGE: php${{ matrix.php }}-dev
        run: |
          ./scripts/bootstrap-local.sh
          echo "PHP_INCLUDE_DIR=$(find "$PWD/.local/sysroot/usr/include/php" -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"
      - run: composer install --no-interaction --ignore-platform-req=ext-asyncara
      - run: make test
      - run: ASYNCARA_BACKEND=poll ./scripts/test.sh
      - run: make audit
      - run: ./scripts/audit-allocations.sh
      - run: ./scripts/test-worker-signals.sh
      - run: ./scripts/test-atomic-failures.sh
      - run: ./scripts/fuzz-native.sh 10 build/fuzz-smoke
      - run: php -n -d extension=$PWD/build/asyncara.so tests/fuzz/protocol_mutation.php 5 10000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-php-${{ matrix.php }}
          path: |
            build/*.log
            build/ci-audit/
            build/fuzz-smoke/run.log
    env:
      ASYNCARA_AUDIT_DIR: build/ci-audit
  database-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Provision disposable runner services and development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 mariadb-server redis-server php8.5-fpm libc6-dbg
          ./scripts/bootstrap-local.sh
          (cd .local/debs && apt download valgrind libc6-dbg)
          for package in .local/debs/valgrind_*.deb .local/debs/libc6-dbg_*.deb; do dpkg-deb -x "$package" .local/sysroot; done
      - run: make build
      - run: ./scripts/prepare-test-certs.sh
      - run: ./scripts/valgrind.sh
      - run: make audit
      - run: ASYNCARA_AUDIT_FATAL_PG=1 ./scripts/test-databases.py --test-file tests/audit/databases.php
      - run: ./scripts/test-databases.py --test-file tests/database/resource_bounds.php
      - run: make audit-fpm
      - run: python3 tests/soak/fpm.py --seconds 60 --output build/fpm-expanded
      - name: Build pinned Connector/C for strict TLS regression
        run: |
          ./scripts/build-test-connector.sh "$PWD/build/tls-connector"
          MARIADB_PREFIX="$PWD/build/tls-connector/install" ASYNCARA_OUTPUT=build/tls.so ./scripts/build-local.sh
      - run: ASYNCARA_EXTENSION=build/tls.so ASYNCARA_TLS_ITERATIONS=100 python3 scripts/test-database-tls.py --output build/database-tls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-lifecycle
          path: |
            build/*.log
            build/ci-audit/
            build/audit-fpm/
            build/fpm-expanded/
            build/database-tls/*client.log
            build/database-tls/report.json
    env:
      ASYNCARA_AUDIT_DIR: build/ci-audit
