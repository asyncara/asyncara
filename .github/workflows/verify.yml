name: Runtime verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Enable matching PHP SDK and FPM packages on disposable runner
        run: sudo add-apt-repository -y ppa:ondrej/php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Extract development dependencies locally
        env:
          PHP_DEV_PACKAGE: php${{ matrix.php }}-dev
        run: |
          mkdir -p build
          if sudo apt-get update > build/ci-bootstrap.log 2>&1 && sudo apt-get install -y libmariadb3 libcurl4t64 libsqlite3-0 libpq5 >> build/ci-bootstrap.log 2>&1 && ./scripts/bootstrap-local.sh >> build/ci-bootstrap.log 2>&1; then
            cat build/ci-bootstrap.log
          else
            cat build/ci-bootstrap.log
            python3 -c 'from pathlib import Path; print("::error::" + "\n".join(Path("build/ci-bootstrap.log").read_text().splitlines()[-30:]).replace("%", "%25").replace("\n", "%0A"))'
            exit 1
          fi
          echo "PHP_INCLUDE_DIR=$(find "$PWD/.local/sysroot/usr/include/php" -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"
      - run: ./scripts/ci-run.sh build/ci-step-1.log bash -c 'composer install --no-interaction --ignore-platform-req=ext-asyncara'
      - run: ./scripts/ci-run.sh build/ci-soak-metrics.log python3 tests/soak/test_metrics.py
      - run: ./scripts/ci-run.sh build/ci-soak-monitor.log python3 tests/soak/test_monitor.py
      - run: ./scripts/ci-run.sh build/ci-scheduling-observer.log python3 tests/soak/test_scheduling_observer.py
      - run: ./scripts/ci-run.sh build/ci-wait-controls.log python3 tests/soak/test_wait_controls.py
      - run: ./scripts/ci-run.sh build/ci-wait-probe.log python3 tests/soak/test_wait_probe.py
      - run: ./scripts/ci-run.sh build/ci-wait-analysis.log python3 tests/soak/test_wait_analysis.py
      - run: ./scripts/ci-run.sh build/ci-soak-peer.log python3 tests/soak/test_fpm_peer.py
      - run: ./scripts/ci-run.sh build/ci-poll-profile.log python3 tests/soak/test_poll_profile.py
      - run: ./scripts/ci-run.sh build/ci-step-2.log bash -c 'python3 scripts/install-test-websockets.py'
      - run: ./scripts/ci-run.sh build/ci-step-3.log bash -c 'make test'
      - run: ./scripts/ci-run.sh build/ci-connector-gate.log ./scripts/test-connector-gate.sh
      - run: ./scripts/ci-run.sh build/ci-step-4.log bash -c './scripts/phpize-local.sh'
      - run: ./scripts/ci-run.sh build/ci-step-5.log bash -c 'ASYNCARA_EXTENSION=ext/modules/asyncara.so ./scripts/test.sh'
      - run: ./scripts/ci-run.sh build/ci-step-6.log bash -c 'ASYNCARA_BACKEND=poll ./scripts/test.sh'
      - run: ./scripts/ci-run.sh build/ci-step-7.log bash -c './scripts/test-network-edges.sh'
      - run: ./scripts/ci-run.sh build/ci-network-failure.log python3 tests/soak/test_network_failure.py --output build/network-failure
      - run: ./scripts/ci-run.sh build/ci-step-8.log bash -c './scripts/test-websocket.sh'
      - run: ./scripts/ci-run.sh build/ci-step-9.log bash -c 'ASYNCARA_BACKEND=poll ./scripts/test-websocket.sh'
      - run: ./scripts/ci-run.sh build/ci-step-10.log bash -c 'php -n tests/fuzz/websocket_mutation.php 5 100000 build/ws-fuzz-smoke'
      - run: ./scripts/ci-run.sh build/ci-step-11.log bash -c 'make audit'
      - run: ./scripts/ci-run.sh build/ci-step-12.log bash -c './scripts/audit-allocations.sh'
      - run: ./scripts/ci-run.sh build/ci-native-mappings.log ./scripts/test-native-mappings.sh
      - run: ./scripts/ci-run.sh build/ci-step-13.log bash -c './scripts/test-worker-signals.sh'
      - run: ./scripts/ci-run.sh build/ci-step-14.log bash -c './scripts/test-atomic-failures.sh'
      - run: ./scripts/ci-run.sh build/ci-step-15.log bash -c 'python3 tests/audit/package_repro.py --output build/package-repro'
      - run: ./scripts/ci-run.sh build/ci-step-16.log bash -c './scripts/fuzz-native.sh 10 build/fuzz-smoke'
      - run: ./scripts/ci-run.sh build/ci-step-17.log bash -c './scripts/fuzz-http-buffers.sh 10 build/fuzz-http-smoke'
      - run: ./scripts/ci-run.sh build/ci-step-18.log bash -c 'php -n -d extension=$PWD/build/asyncara.so tests/fuzz/protocol_mutation.php 5 10000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-php-${{ matrix.php }}
          path: |
            build/*.log
            build/ci-audit/
            build/fuzz-smoke/run.log
            build/fuzz-smoke/artifacts/
            build/fuzz-http-smoke/run.log
            build/fuzz-http-smoke/artifacts/
            build/ws-fuzz-smoke/
            build/network-failure/
    env:
      ASYNCARA_AUDIT_DIR: build/ci-audit
  database-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable matching PHP SDK and FPM packages on disposable runner
        run: sudo add-apt-repository -y ppa:ondrej/php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Provision disposable runner services and development tools
        run: |
          mkdir -p build
          if sudo apt-get update > build/ci-provision.log 2>&1 && sudo apt-get install -y postgresql-16 mariadb-server redis-server php8.5-fpm libc6-dbg >> build/ci-provision.log 2>&1 && ./scripts/bootstrap-local.sh >> build/ci-provision.log 2>&1; then
            cat build/ci-provision.log
          else
            cat build/ci-provision.log
            python3 -c 'from pathlib import Path; print("::error::" + "\n".join(Path("build/ci-provision.log").read_text().splitlines()[-30:]).replace("%", "%25").replace("\n", "%0A"))'
            exit 1
          fi
          (cd .local/debs && apt download valgrind libc6-dbg)
          for package in .local/debs/valgrind_*.deb .local/debs/libc6-dbg_*.deb; do dpkg-deb -x "$package" .local/sysroot; done
      - run: ./scripts/ci-run.sh build/ci-step-19.log bash -c 'make build'
      - run: ./scripts/ci-run.sh build/ci-step-20.log bash -c './scripts/prepare-test-certs.sh'
      - run: ./scripts/ci-run.sh build/ci-stock-databases.log ./scripts/test-databases.py
      - name: Build dependencies with their supported Valgrind stack annotations
        run: |
          ./scripts/ci-run.sh build/ci-php-debug-build.log ./scripts/build-test-php.sh "$PWD/build/php-valgrind"
          ASYNCARA_CONNECTOR_VALGRIND=1 ./scripts/ci-run.sh build/ci-connector-build.log ./scripts/build-test-connector.sh "$PWD/build/tls-connector"
          PHP_BIN="$PWD/build/php-valgrind/install/bin/php" PHP_INCLUDE_DIR="$PWD/build/php-valgrind/install/include/php" MARIADB_PREFIX="$PWD/build/tls-connector/install" ASYNCARA_OUTPUT=build/valgrind.so ./scripts/build-local.sh
      - run: ./scripts/ci-run.sh build/ci-step-21.log bash -c 'PHP_BIN="$PWD/build/php-valgrind/install/bin/php" ASYNCARA_EXTENSION=build/valgrind.so ./scripts/valgrind.sh'
      - run: ./scripts/ci-run.sh build/ci-step-22.log bash -c 'make audit'
      - run: ./scripts/ci-run.sh build/ci-step-23.log bash -c 'PHP_BIN="$PWD/build/php-valgrind/install/bin/php" ASYNCARA_EXTENSION=build/valgrind.so ASYNCARA_AUDIT_FATAL_PG=1 ./scripts/test-databases.py --test-file tests/audit/databases.php'
      - run: ./scripts/ci-run.sh build/ci-step-24.log bash -c './scripts/test-databases.py --test-file tests/database/resource_bounds.php'
      - run: ./scripts/ci-run.sh build/ci-step-25.log bash -c 'make audit-fpm'
      - run: ./scripts/ci-run.sh build/ci-step-26.log bash -c 'python3 tests/soak/fpm.py --seconds 60 --output build/fpm-expanded'
      - name: Build pinned Connector/C for strict TLS regression
        run: |
          MARIADB_PREFIX="$PWD/build/tls-connector/install" ASYNCARA_OUTPUT=build/tls.so ./scripts/build-local.sh
      - run: ./scripts/ci-run.sh build/ci-step-27.log bash -c 'ASYNCARA_EXTENSION=build/tls.so ASYNCARA_TLS_ITERATIONS=100 python3 scripts/test-database-tls.py --output build/database-tls'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-lifecycle
          path: |
            build/*.log
            build/ci-audit/
            build/audit-fpm/
            build/fpm-expanded/
            build/database-tls/*client.log
            build/database-tls/report.json
    env:
      ASYNCARA_AUDIT_DIR: build/ci-audit
