[package]
name = "asyncara-hyper-bridge"
version = "0.10.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"
[features]
ffi-fault-tests = [] # Isolated native regression builds only; never a production default.
[lib]
crate-type = ["staticlib"]
[dependencies]
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
h2 = "=0.4.20"
httparse = "=1.10.1"
base64 = "=0.22.1"
tokio = { version = "=1.54.1", default-features = false } # IO traits only; no runtime/executor.
http-body-util = "=0.1.5"
libc = "0.2"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pemfile = "=2.2.0"
zeroize = "=1.9.1"
[profile.release]
lto = "thin"
codegen-units = 1
