[package]
name = "asyncara-hyper-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"
[features]
ffi-fault-tests = [] # Isolated native regression builds only; never a production default.
[lib]
crate-type = ["staticlib"]
[dependencies]
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
http-body-util = "=0.1.5"
libc = "0.2"
[profile.release]
lto = "thin"
codegen-units = 1
